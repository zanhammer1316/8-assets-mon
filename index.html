<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDX & Market Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }
    .chart-box {
      height: 240px; /* Slightly taller to fit both the header and tabs nicely */
      border-radius: 6px;
      overflow: hidden;
      background: #1e293b;
    }
  </style>
</head>
<body>

  <div class="grid" id="chart-grid"></div>

  <script>
    const assets = [
      "IDX:BBCA",
      "IDX:ASII",
      "IDX:PTBA",
      "IDX:INDF",
      "FX_IDC:USDIDR",
      "OANDA:XAUUSD"
    ];

    const grid = document.getElementById("chart-grid");

    assets.forEach(symbol => {
      const box = document.createElement("div");
      box.className = "chart-box";

      const widgetContainer = document.createElement("div");
      widgetContainer.className = "tradingview-widget-container";
      widgetContainer.style.height = "100%";
      widgetContainer.style.width = "100%";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        "symbols": [
          [symbol]
        ],
        "chartOnly": false, // Shows the ticker header name
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "colorTheme": "dark",
        "autosize": true,
        "showVolume": false,
        "hideDateRanges": false, // Shows timeframe tabs
        "hideMarketStatus": true,
        "backgroundColor": "rgba(30, 41, 59, 1)",
        "dateFormat": "MMM dd"
      });

      widgetContainer.appendChild(script);
      box.appendChild(widgetContainer);
      grid.appendChild(box);
    });
  </script>

</body>
</html>
