<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }
    .chart-box {
      height: 240px;
      border-radius: 6px;
      overflow: hidden;
      background: #1e293b;
      zoom: 0.78;
    }
  </style>
</head>
<body>

  <div class="grid" id="chart-grid"></div>

  <script>
    const assets = [
      { symbol: "IDX:BBCA", type: "overview" },
      { symbol: "IDX:ASII", type: "overview" },
      { symbol: "IDX:PTBA", type: "overview" },
      { symbol: "IDX:INDF", type: "overview" },
      { symbol: "FX_IDC:USDIDR", type: "mini" },
      { symbol: "OANDA:XAUUSD", type: "mini" }
    ];

    const grid = document.getElementById("chart-grid");

    assets.forEach(item => {
      const box = document.createElement("div");
      box.className = "chart-box";

      const widgetContainer = document.createElement("div");
      widgetContainer.className = "tradingview-widget-container";
      widgetContainer.style.height = "100%";
      widgetContainer.style.width = "100%";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.async = true;

      if (item.type === "overview") {
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
        script.innerHTML = JSON.stringify({
          "symbols": [[item.symbol]],
          "chartOnly": false,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "colorTheme": "dark",
          "autosize": true,
          "showVolume": false,
          "hideDateRanges": false,
          "hideMarketStatus": true,
          "backgroundColor": "rgba(30, 41, 59, 1)",
          "dateFormat": "MMM dd",
          "timeFrame": "1Y"
        });
      } else {
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
        script.innerHTML = JSON.stringify({
          "symbol": item.symbol,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "12M",
          "colorTheme": "dark",
          "isTransparent": false,
          "autosize": true,
          "largeChartUrl": ""
        });
      }

      widgetContainer.appendChild(script);
      box.appendChild(widgetContainer);
      grid.appendChild(box);
    });
  </script>

</body>
</html>
