<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDX & Market Watchlist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }
    .chart-box {
      height: 162px;
      border-radius: 6px;
      overflow: hidden;
      background: #1e293b;
    }
  </style>
</head>
<body>

  <div class="grid" id="chart-grid"></div>

  <script>
    // Each asset specifies its own supported dateRange ("1M", "3M", "12M" for IDX; "1D" for FX/Gold)
    const assets = [
      { symbol: "IDX:BBCA",      range: "6M" }, // Bank Central Asia
      { symbol: "IDX:ASII",      range: "6M" }, // Astra International
      { symbol: "IDX:PTBA",      range: "6M" }, // Bukit Asam
      { symbol: "IDX:BSSR",      range: "6M" }, // Baramulti Suksessarana
      { symbol: "IDX:INDF",      range: "6M" }, // Indofood Sukses Makmur
      { symbol: "IDX:ICBP",      range: "6M" }, // Indofood CBP
      { symbol: "FX_IDC:USDIDR", range: "1M" }, // USD to IDR Exchange Rate
      { symbol: "OANDA:XAUUSD",  range: "1M" }  // XAU to USD Gold Spot Price
    ];

    const grid = document.getElementById("chart-grid");

    assets.forEach(item => {
      const box = document.createElement("div");
      box.className = "chart-box";

      const widgetContainer = document.createElement("div");
      widgetContainer.className = "tradingview-widget-container";
      widgetContainer.style.height = "100%";
      widgetContainer.style.width = "100%";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        "symbol": item.symbol,
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "dateRange": item.range,
        "colorTheme": "dark",
        "isTransparent": false,
        "autosize": true,
        "largeChartUrl": ""
      });

      widgetContainer.appendChild(script);
      box.appendChild(widgetContainer);
      grid.appendChild(box);
    });
  </script>

</body>
</html>
